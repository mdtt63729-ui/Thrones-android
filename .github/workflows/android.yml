name: Build Thrones Mobile (APK)

on:
  push:
    branches: [mobile]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the original UI (unchanged)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx vite build --base ./

      - name: Copy UI into the app
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r frontend/dist/. android/app/src/main/assets/www/
          node android/tools/inject.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare the Android SDK that ships with the runner
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin 2>/dev/null | head -1)/sdkmanager
          echo "sdkmanager: $SDKM"
          yes | sudo "$SDKM" --licenses > /dev/null || true
          sudo "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build per-architecture release APKs
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Sign the APKs with the repository signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          mkdir -p out
          echo "$KEYSTORE_B64" | base64 -d > out/thrones-release.p12
          for f in android/app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" | sed -E 's/app-(.*)-release-unsigned\.apk/\1/')
            "$BT/zipalign" -f 4 "$f" "out/aligned.apk"
            "$BT/apksigner" sign --ks out/thrones-release.p12 --ks-type PKCS12 \
              --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" --out "out/thrones-$abi.apk" "out/aligned.apk"
            rm -f "out/aligned.apk"
            echo "signed thrones-$abi.apk"
          done
          "$BT/apksigner" verify --print-certs out/thrones-arm64-v8a.apk | head -4
          ls -lh out

      - name: Package the source code
        run: |
          git archive --format=zip --prefix=thrones-mobile-source/ -o out/thrones-mobile-source.zip HEAD

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thrones-mobile-apks
          path: out/*
          retention-days: 90

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-build-${{ github.run_number }}
          name: Thrones Mobile build ${{ github.run_number }}
          body: |
            Signed APKs, one per CPU architecture, plus the source code.

            Every APK here is signed with the repository's own signing key, held in the
            Actions secrets KEYSTORE_B64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD.

            Install the `arm64-v8a` file on almost any phone from the last few years.
          files: out/*
          prerelease: true
          make_latest: false
